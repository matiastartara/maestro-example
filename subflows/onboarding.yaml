appId: org.wikipedia
---
# Subflow: dismiss the Wikipedia app onboarding carousel and open the search tab.
# Requires elements/loadElements.yaml to be loaded by the calling flow.
- tapOn: ${output.onboarding.forwardBtn}
- tapOn: ${output.onboarding.forwardBtn}
- tapOn: ${output.onboarding.forwardBtn}
- tapOn: ${output.onboarding.skipBtn}
- tapOn:
    id: ${output.navigation.tabIcon}
    index: ${output.navigation.searchTabIndex}
